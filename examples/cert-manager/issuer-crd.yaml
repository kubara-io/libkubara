# Source: https://github.com/cert-manager/cert-manager/blob/master/deploy/crds/crd-issuers.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: issuers.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: Issuer
    listKind: IssuerList
    plural: issuers
    singular: issuer
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                acme:
                  type: object
                  required:
                    - server
                    - privateKeySecretRef
                  properties:
                    server:
                      type: string
                    email:
                      type: string
                    skipTLSVerify:
                      type: boolean
                      default: false
                    privateKeySecretRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: tls.key
                    solvers:
                      type: array
                      items:
                        type: object
                        properties:
                          http01:
                            type: object
                            properties:
                              ingress:
                                type: object
                                properties:
                                  class:
                                    type: string
                          dns01:
                            type: object
                            properties:
                              cloudflare:
                                type: object
                                properties:
                                  email:
                                    type: string
                                  apiTokenSecretRef:
                                    type: object
                                    required:
                                      - name
                                    properties:
                                      name:
                                        type: string
                                      key:
                                        type: string
                ca:
                  type: object
                  required:
                    - secretName
                  properties:
                    secretName:
                      type: string
                selfSigned:
                  type: object
                  properties:
                    crlDistributionPoints:
                      type: array
                      items:
                        type: string
                vault:
                  type: object
                  required:
                    - server
                    - path
                  properties:
                    server:
                      type: string
                    path:
                      type: string
                    auth:
                      type: object
                      properties:
                        tokenSecretRef:
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                            key:
                              type: string
