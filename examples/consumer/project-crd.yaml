apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.platform.example.io
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    plural: projects
    singular: project
    kind: Project
    listKind: ProjectList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [owner]
              x-kubernetes-validations:
                - rule: self.stage != 'prod' || self.replicas >= 2
                  message: production projects require at least two replicas
              properties:
                owner:
                  type: string
                  minLength: 1
                stage:
                  type: string
                  enum: [dev, staging, prod]
                  default: dev
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
